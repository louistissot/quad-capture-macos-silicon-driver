<h2>Uninstall the QUAD-CAPTURE Driver</h2>
<p>This package removes the QUAD-CAPTURE driver from this Mac. It removes
<code>/Library/Audio/Plug-Ins/HAL/QuadCapture.driver</code>.</p>
<p><b>CAUTION:</b> At the end, the macOS audio service restarts.
All audio on the Mac stops for a few seconds.</p>
</body>
