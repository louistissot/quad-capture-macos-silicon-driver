name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build the driver and the tools
        run: ./build.sh

      - name: Build the installer packages
        run: ./packaging/make_pkg.sh

      - name: Check the binaries
        run: |
          lipo -archs build/QuadCapture.driver/Contents/MacOS/QuadCapture
          codesign --verify --verbose build/QuadCapture.driver
          pkgutil --payload-files dist/QuadCapture-Driver-*.pkg | grep -q "Library/Audio/Plug-Ins/HAL/QuadCapture.driver"

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/

      - name: Make a draft release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" dist/*.pkg dist/SHA256SUMS.txt \
            --draft --title "QuadCaptureMac $GITHUB_REF_NAME" --notes-file CHANGELOG.md
